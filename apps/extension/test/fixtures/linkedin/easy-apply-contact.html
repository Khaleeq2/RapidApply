<!doctype html>
<html lang="en">
  <head><title>Apply to Fixture Labs | LinkedIn</title></head>
  <body>
    <div class="job-details-jobs-unified-top-card" data-job-id="123456789">
      <div class="job-details-jobs-unified-top-card__job-title"><h1>Senior Product Designer</h1></div>
      <div class="job-details-jobs-unified-top-card__company-name">Fixture Labs</div>
    </div>
    <section class="jobs-easy-apply-modal" role="dialog" aria-labelledby="easy-apply-heading">
      <h2 id="easy-apply-heading">Contact info</h2>
      <form>
        <div class="jobs-easy-apply-form-element">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" value="private-candidate@example.test" required>
        </div>
        <div class="jobs-easy-apply-form-element">
          <label for="phone">Mobile phone number</label>
          <input id="phone" name="phone" type="tel" value="+1 555 010 9999" required>
        </div>
        <button type="button" aria-label="Continue to next step">Next</button>
      </form>
    </section>
  </body>
</html>
