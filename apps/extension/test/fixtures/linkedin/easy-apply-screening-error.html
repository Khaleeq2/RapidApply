<!doctype html>
<html lang="en">
  <head><title>Apply to Fixture Labs | LinkedIn</title></head>
  <body>
    <div class="job-details-jobs-unified-top-card" data-job-id="123456789">
      <div class="job-details-jobs-unified-top-card__job-title"><h1>Senior Product Designer</h1></div>
      <div class="job-details-jobs-unified-top-card__company-name">Fixture Labs</div>
    </div>
    <section class="jobs-easy-apply-modal" role="dialog" aria-labelledby="questions-heading">
      <h2 id="questions-heading">Additional questions</h2>
      <form>
        <div class="jobs-easy-apply-form-element">
          <label for="experience">How many years of product design experience do you have?</label>
          <input id="experience" name="experience" type="number" aria-describedby="experience-error" required>
          <span id="experience-error" class="artdeco-inline-feedback__message" role="alert">Enter a whole number from 0 to 99</span>
        </div>
        <div class="jobs-easy-apply-form-element">
          <label for="authorization">Are you legally authorized to work in the United States?</label>
          <select id="authorization" name="authorization" required>
            <option value="">Select an option</option>
            <option value="yes">Yes</option>
            <option value="no">No</option>
          </select>
        </div>
        <button type="button" aria-label="Review your application">Review</button>
      </form>
    </section>
  </body>
</html>
