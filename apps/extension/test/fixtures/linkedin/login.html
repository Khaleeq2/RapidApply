<!doctype html>
<html lang="en">
  <head><title>Sign in | LinkedIn</title></head>
  <body>
    <main>
      <h1>Sign in</h1>
      <form>
        <label for="session-key">Email or phone</label>
        <input id="session-key" autocomplete="username" value="fixture-user@example.test">
        <label for="session-password">Password</label>
        <input id="session-password" type="password" autocomplete="current-password" value="fixture-password">
        <button type="submit">Sign in</button>
      </form>
    </main>
  </body>
</html>
